name: Flake Detector

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-flakes:
    if: |
      github.event.issue.pull_request
      && contains(github.event.comment.body, '/flake-check')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Create .env file
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=postgres" >> .env
          echo "DB_PORT=5432" >> .env

      - name: Download database file
        run: |
          curl -L -o db/mass_spectrum_db.sql \
          https://github.com/NicolasMurphy/mass-spectrum-to-audio-converter/releases/download/2025-08-19/mass_spectrum_db.sql

      - name: Start services
        run: docker compose up -d --wait

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Playwright dependencies
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Parse comment args
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 <<'EOF'
          import os, re, shlex

          body = os.environ["COMMENT_BODY"]
          match = re.search(r'/flake-check\b([^\n\r]*)', body)
          args_str = match.group(1).strip() if match else ""

          try:
              tokens = shlex.split(args_str)
          except ValueError:
              tokens = []

          spec = ""
          project = ""
          grep = ""
          repeat = 10

          i = 0
          while i < len(tokens):
              t = tokens[i]
              if t == "-g" and i + 1 < len(tokens):
                  candidate = tokens[i + 1]
                  if len(candidate) <= 100:
                      grep = candidate
                  i += 2
                  continue
              if t.startswith("--project="):
                  value = t.split("=", 1)[1]
                  if re.fullmatch(r'[a-zA-Z0-9_-]{1,50}', value):
                      project = value
                  i += 1
                  continue
              if t.startswith("--repeat="):
                  value = t.split("=", 1)[1]
                  if value.isdigit():
                      n = int(value)
                      if 1 <= n <= 100:
                          repeat = n
                  i += 1
                  continue
              if re.fullmatch(r'[a-zA-Z0-9_./-]{1,100}\.spec\.ts', t):
                  spec = t
                  i += 1
                  continue
              i += 1

          print(f"Resolved args: spec={spec or '(none)'} grep={grep or '(none)'} project={project or '(all)'} repeat={repeat}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SPEC={spec}\n")
              f.write(f"GREP={grep}\n")
              f.write(f"PROJECT={project}\n")
              f.write(f"REPEAT={repeat}\n")
          EOF

      - name: Run flake detector
        working-directory: tests/playwright
        run: |
          ARGS=()
          [ -n "$SPEC" ] && ARGS+=("$SPEC")
          [ -n "$GREP" ] && ARGS+=("-g" "$GREP")
          [ -n "$PROJECT" ] && ARGS+=("--project=$PROJECT")
          ARGS+=("--repeat=$REPEAT")
          npm run detect-flakes -- "${ARGS[@]}"

      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flake-report
          path: tests/playwright/flake-report.json
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: tests/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down -v
