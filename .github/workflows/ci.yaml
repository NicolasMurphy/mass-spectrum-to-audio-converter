name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Create .env file
        run: |
          echo "FLASK_ENV=development" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=postgres" >> .env
          echo "DB_PORT=5432" >> .env

      - name: Download database file
        run: |
          curl -L -o db/mass_spectrum_db.sql \
          https://github.com/NicolasMurphy/mass-spectrum-to-audio-converter/releases/download/2025-08-19/mass_spectrum_db.sql

      - name: Start services
        run: docker compose up -d --wait

      - name: Run backend tests
        run: docker compose exec -T app python -m pytest tests/ -v --cov=. --cov-report=term-missing

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/playwright/package-lock.json') }}

      - name: Install Playwright dependencies
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npm run test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: tests/playwright/test-results/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down -v
