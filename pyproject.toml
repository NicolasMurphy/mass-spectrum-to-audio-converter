[tool.mutmut]
paths_to_mutate = ["api/validation.py", "audio/"]
pytest_add_cli_args_test_selection = ["tests/unit"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["B", "C4", "I", "PERF", "PIE", "PTH", "RET", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.13"
include = ["api", "audio", "db", "utils", "app.py", "gunicorn.conf.py"]
exclude = ["tests", "frontend", ".ruff_cache", "**/node_modules", "**/__pycache__"]
typeCheckingMode = "strict"
